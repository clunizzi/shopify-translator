allowed_resource_types:
  - ONLINE_STORE_THEME_JSON_TEMPLATE
  - ONLINE_STORE_THEME_SECTION_GROUP
  - ONLINE_STORE_THEME_LOCALE_CONTENT

# Locale resources also contain Shopify-managed checkout/account strings.
# List only namespaces owned by your theme or store.
allowed_locale_key_prefixes:
  - customloc.

# Theme JSON evolves continuously and merchants can invent setting IDs. After
# the explicit technical deny-list below, textual values are storefront copy.
translate_unclassified_text: true

allowed_key_fragments:
  - announcement
  - button_label
  - button_name
  - caption
  - description
  - heading
  - link_label
  - link_name
  - subheading
  - text
  - title

blocked_leaf_names:
  - address
  - author
  - brand
  - business_name
  - countdown_end
  - discount_code
  - discount_percent
  - image
  - image_mobile
  - offer_threshold
  - score
  - selected_models
  - short_name
  - tags
  - updated_at

blocked_key_fragments:
  - alignment
  - autoplay
  - block_order
  - collection_handle
  - color
  - column
  - desktop
  - icon
  - layout
  - logo_svg
  - margin
  - mobile
  - opacity
  - overlay
  - padding
  - product_handle
  - speed
  - svg
  - _tag
  - url
  - width

# A generic `value` can be visible copy, so block only known technical contact
# value paths rather than blocking every field named `value`.
blocked_key_path_fragments:
  - .email.value
  - .messenger.value
  - .phone.value
  - .whatsapp.value

blocked_value_patterns:
  - '^\s*$'
  - '^\s*\{\{.*\}\}\s*$'
  - '^\s*\{%.*%\}\s*$'
  - '^\s*<svg[\s>].*</svg>\s*$'
  - '^\s*https?://'
  - '^\s*shopify://'
  - '^\s*[\[{].*[\]}]\s*$'
