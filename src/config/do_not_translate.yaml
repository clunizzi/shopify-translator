# Safe, generic defaults. Copy this file to `do_not_translate.local.yaml` and
# point DO_NOT_TRANSLATE_YAML at it for store-specific brands and terminology.
brands:
  - "ExampleBrand"

units:
  - "mm"
  - "cm"
  - "m"
  - "km"
  - "m²"
  - "ml"
  - "L"
  - "g"
  - "kg"
  - "bar"
  - "psi"
  - "V"
  - "A"
  - "Ah"
  - "W"
  - "kW"
  - "Wh"
  - "kWh"
  - "rpm"
  - "Hz"
  - "dB"
  - "°C"
  - "°F"
  - "%"

tokens:
  - "SKU"
  - "EAN"
  - "UPC"
  - "MPN"
  - "OEM"
  - "CE"
  - "RoHS"
  - "ISO"
  - "DIN"
  - "IP65"
  - "IP66"
  - "IP67"
  - "IP68"
  - "Li-Ion"
  - "Bluetooth"

# Optional deterministic terminology. Keys are source phrases and each value
# lists acceptable target-language renderings.
glossary:
  fr:
    drill:
      - "perceuse"
  de:
    drill:
      - "Bohrmaschine"
